[project]
name = "prelude"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.2",
    "segno>=1.6.6",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# The browser suite drives headless Chromium over a local server, so it is
# slower than the unit suite and needs a browser installed. It is run by
# naming it, `pytest tests/browser`, and the default run leaves it out.
norecursedirs = ["*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}", "browser"]
markers = [
    "browser: drives a real browser over a local server (tests/browser)",
]

[dependency-groups]
dev = [
    "cmudict>=1.1.3",
    "faster-whisper>=1.2.1",
    "fonttools>=4.56.0",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "playwright>=1.65.1",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "zxing-cpp>=3.1.1",
]
