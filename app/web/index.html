<title>Prelude</title>
<!--
  Entry point. Opens on the picker and holds every screen in one phone frame.

  The frame lives here rather than on each screen, so navigating does not
  rebuild it: the screens load into #screen and the bezel never reloads. Each
  screen is also a standalone page, and app/web/phone-frame.css draws its own
  frame when one is opened directly. Inside this shell the iframe is 390px
  wide, below that stylesheet's 501px breakpoint, so the two never both apply.
-->
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background-color: #101319;        /* surface */
    overflow: hidden;
  }
  /* The launch screen: the mark over the tagline, on the app background.
     It covers the frame rather than replacing it, so the picker loads behind
     it and is ready the moment this goes.

     The layout is `app/web/assets/brand/prelude_launch.svg`, read in CSS: the
     mark 300 px wide, 20 px of air, the tagline at 16 px, and the block 24 px
     above the middle of the screen. The mark is inlined below rather than
     fetched, so the first frame of a visit costs no request the list did not
     already cost. */
  #launch {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 0 24px;
    text-align: center;
    background-color: #101319;        /* surface */
    transition: opacity 300ms ease;   /* FADE_MS below; the two are one number */
  }
  /* The 24 px the brand file lifts the block by, so the pair sits above the
     middle of the screen rather than on it. */
  #launch > * { transform: translateY(-24px); }
  /* `hidden` alone loses to the display above, which is why this is here. */
  #launch[hidden] { display: none; }
  /* The one step of the fade. Pointer events go first, so the frame behind is
     reachable from the moment the fade starts. */
  #launch[data-going] { opacity: 0; pointer-events: none; }

  /* The mark is an image with its own colours: white letters, the seven bars
     and the full stop amber. It is drawn by scripts/brand/build_svg.py and
     copied in from app/web/assets/brand/prelude_mark.svg, which
     tests/test_the_mark.py holds this copy to. */
  #launch-mark {
    display: block;
    width: 300px;
    max-width: 100%;
    height: auto;
  }

  #launch-line {
    margin: 0;
    font-family: "Hanken Grotesk", system-ui, sans-serif;
    font-weight: 500;
    font-size: 16px;
    line-height: 20px;
    color: #ffb703;                   /* primary-container */
  }

  /* A fan who has asked for less motion gets the same screen and no fade:
     it is shown, and then it is not. */
  @media (prefers-reduced-motion: reduce) {
    #launch { transition: none; }
  }

  #frame { width: 100%; height: 100%; }
  #screen { display: block; width: 100%; height: 100%; border: 0; }

  /* Above the breakpoint, the same bezel phone-frame.css draws. */
  @media (min-width: 501px) {
    html { background-color: #0b0e13; }   /* surface-container-lowest */
    body {
      /* The base layer paints body #101319, and here body fills the viewport,
         which would cover the backdrop on html. The phone keeps its own
         colour; the page behind it does not need one. */
      background-color: transparent;
      display: flex;
      align-items: safe center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px 0;
      box-sizing: border-box;
      overflow: auto;
    }
    /* The stadium behind the phone. The blur sits on a pseudo-element so the
       phone itself stays sharp, and the dim keeps it the brightest thing here. */
    html::before,
    html::after {
      content: "";
      position: fixed;
      inset: -24px;
      z-index: -1;
      pointer-events: none;
    }

    html::before {
      background-image: url("assets/stadium-bg.jpg?v=__V__");
      background-size: cover;
      background-position: center;
      filter: blur(8px);
    }

    html::after {
      background-color: rgba(16, 19, 25, 0.5);   /* #101319 at 50% */
    }

    #frame {
      box-sizing: content-box;
      flex: none;
      width: 390px;
      height: 844px;
      border: 16px solid #32353b;        /* surface-container-highest */
      border-radius: 48px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.55);
      overflow: hidden;
    }
  }
</style>

     its own. It is the paths out of app/web/assets/brand/prelude_mark.svg and

<p id="launch-line">Leave your seat. Stay in the game.</p>

<div id="frame">
<iframe allow="camera" id="screen" src="prelude_01_picker.html?v=__V__" title="Prelude"></iframe>
</div>
<script>
  /* Taking the launch screen away.
   *
   * Every full load of this page paints it, a reload included. It used to
   * paint once per tab, decided in the head out of sessionStorage, which made
   * the mark something a fan saw once and then could not get back to. It
   * costs a fraction of a second and it is what the app is called, so the
   * only question left is how it goes, which is the rest of this.
   *
   * It stays until the screen behind it is ready, which on a normal visit is
   * the event list: `data-matches-loaded` on that document is the renderer
   * saying matches.json was answered. It is not `data-match-rendered`, which
   * is the stronger claim that one match's copy is on the screen; the list
   * never makes it, because Prelude renders no match until the fan has
   * picked one. The frame is same origin, so the shell can read it.
   *
   * Three numbers bound it, settled on 2026-11-15.
   *
   * MIN_HOLD_MS is the hold: the mark is on screen for at least this long on
   * every full load, even where the list behind it was answered out of a
   * cache before the first frame. Without a hold the same screen is a flicker
   * on a fast load and a launch screen on a slow one, which reads as a fault
   * rather than as the app being called something.
   *
   * FADE_MS is the fade, and it is the number in the stylesheet above.
   *
   * CAP_MS is the last moment a fan can see it, whatever the list did: a
   * fetch that fails or never answers leaves a fan looking at the app rather
   * than at a wordmark, and the screen behind has its own inline copy for
   * exactly that case. So the fade starts CAP_MS - FADE_MS in, and the cap
   * bounds the screen rather than the start of the fade. The cap is later
   * than the hold, which is why the hold is always served first.
   *
   * The clock is performance.now(), which counts from the start of the
   * navigation rather than from whenever this script ran, so both bounds are
   * measured from the load the fan started.
   */
  (function () {
    var MIN_HOLD_MS = 1500;
    var FADE_MS = 300;
    var CAP_MS = 2500;
    var POLL_MS = 60;

    var launch = document.getElementById('launch');
    if (!launch) return;

    var screen = document.getElementById('screen');
    var started = Date.now();
    var going = false;
    var poll = null;
    var cap = null;
    var holding = null;

    function elapsed() {
      try {
        return performance.now();
      } catch (e) {
        return Date.now() - started;
      }
    }

    function reduced() {
      try {
        return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      } catch (e) {
        return false;
      }
    }

    function gone() {
      launch.hidden = true;
    }

    // Take it away. A fan who has asked for less motion gets the same hold
    // and no fade: it is shown, and then it is not.
    function leave() {
      if (going) return;
      going = true;
      if (poll) window.clearInterval(poll);
      if (cap) window.clearTimeout(cap);
      if (holding) window.clearTimeout(holding);
      if (reduced()) {
        gone();
        return;
      }
      launch.setAttribute('data-going', '');
      window.setTimeout(gone, FADE_MS);
    }

    // The list is ready, or the cap has come up. Either way what is left of
    // the hold is waited out first.
    function go() {
      if (going) return;
      var left = MIN_HOLD_MS - elapsed();
      if (left <= 0) {
        leave();
        return;
      }
      if (holding) return;
      if (poll) {
        window.clearInterval(poll);
        poll = null;
      }
      holding = window.setTimeout(leave, left);
    }

    function ready() {
      // A predicate that throws is a predicate that stops the poll, and the
      // frame's document is null while it is navigating, so every step of
      // this answers false rather than throwing.
      try {
        var doc = screen && screen.contentDocument;
        return !!doc && !!doc.documentElement &&
               doc.documentElement.hasAttribute('data-matches-loaded');
      } catch (e) {
        return false;
      }
    }

    if (ready()) {
      go();
    } else {
      poll = window.setInterval(function () { if (ready()) go(); }, POLL_MS);
    }
    cap = window.setTimeout(go, Math.max(0, CAP_MS - FADE_MS - elapsed()));
  })();
</script>
<script>
  /* A ticket code is a link to here: /?ticket=<match>:<section>:<row>:<seat>.
   *
   * A phone's own camera app offers to open a URL and nothing else, so the
   * codes point at the site and the seat rides in the query string. The shell
   * hands it to the ticket screen, which is the one that knows matches.json and
   * so is the one that can say whether the seat is a ticket we hold.
   */
  (function () {
    var code = /[?&]ticket=([^&#]+)/.exec(window.location.search);
    if (!code) return;
    var parts = /^(\d+):([^:]+):([^:]+):([^:]+)$/.exec(decodeURIComponent(code[1]));
    if (!parts) return;   // not a ticket shape; the list opens as usual
    var screen = document.getElementById('screen');
    screen.src = 'prelude_06_ticket.html?v=__V__&match=' + parts[1] +
                 '&ticket=' + encodeURIComponent(parts[2] + ':' + parts[3] + ':' + parts[4]);
  })();
</script>
